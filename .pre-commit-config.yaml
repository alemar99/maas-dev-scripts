repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.4
  hooks:
    - id: ruff-check
      types: [ python ]
      args: [ --fix, "--extend-select=I,E" ]
      exclude: "overlay-mount.py"
    - id: ruff-format
      types: [ python ]
      exclude: "overlay-mount.py"
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.11.0.1-1
  hooks:
    - id: shellcheck
      args: [ -x ]
      types: [ shell ]
