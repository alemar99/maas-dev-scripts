deb:
  package: maas
  dirs:
    /work/src/apiclient: /usr/lib/python3/dist-packages/apiclient
    /work/src/maasapiserver: /usr/lib/python3/dist-packages/maasapiserver
    /work/src/maascli: /usr/lib/python3/dist-packages/maascli
    /work/src/maascommon: /usr/lib/python3/dist-packages/maascommon
    /work/src/maasserver: /usr/lib/python3/dist-packages/maasserver
    /work/src/maasservicelayer: /usr/lib/python3/dist-packages/maasservicelayer
    /work/src/maastemporalworker: /usr/lib/python3/dist-packages/maastemporalworker
    /work/src/metadataserver: /usr/lib/python3/dist-packages/metadataserver
    /work/src/provisioningserver: /usr/lib/python3/dist-packages/provisioningserver
    /work/src/maasui/build: /usr/share/maas/web/static
    /work/src/host-info/bin: /usr/share/maas/machine-resources
  files:
    /work/src/maasagent/build/maas-agent: /usr/sbin/maas-agent
    /work/src/maasagent/build/maas-netmon: /usr/sbin/maas-netmon

